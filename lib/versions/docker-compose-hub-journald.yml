# Override of docker-compose-hub-<variant>.yml on the staging host: the
# containers log to the journal of the host, so the logs stay after the
# recreation of the containers at a deploy. deploy-hubs.sh adds this file to
# each compose call. Docker Desktop has no journald, so the local deploy does
# not use it.
#   journalctl CONTAINER_NAME=mp-multitenancy-pl-hub-api-1 --since yesterday
x-journald: &journald
  logging:
    driver: journald
services:
  api: *journald
  ui: *journald
  commons: *journald
  db: *journald
  zoo: *journald
  solr: *journald
  redis: *journald
  transform-api: *journald
  transform-worker: *journald
