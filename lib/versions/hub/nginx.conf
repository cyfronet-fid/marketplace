# nginx of a discovery hub UI (mounted by docker-compose-hub-<variant>.yml).
# The Angular application is served from the image; every /api/ request goes
# to the api service of the same compose project. TLS ends at the Apache
# reverse proxy of the host, which forwards to the published port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
