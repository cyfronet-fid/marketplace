name: Backend tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  rspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # ci_node values must span 1..N_GROUPS, N_GROUPS must match --only-group's -n below
      matrix:
        ci_node: [1, 2, 3, 4]

    steps:
    - name: Configure sysctl limits
      run: |
        sudo swapoff -a
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144
    - uses: actions/checkout@v4
    - name: Start containers
      run: docker compose -f docker-compose-x64.yml up -d
    - name: Install VIPS
      run: |
        echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
        sudo apt-get update
        sudo NEEDRESTART_MODE=a apt-get install libvips42 -y --no-install-recommends
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - uses: actions/setup-node@v4
      with:
        node-version: '20.12.2'
        check-latest: true
        cache: yarn
    - run: yarn
    - name: Setup DB, Run tests
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      run: |
        # The migration history is squashed: a fresh database comes from db/schema.rb.
        bundle exec rake db:drop db:create db:schema:load RAILS_ENV=test
        bundle exec rake test:prepare
        bundle exec parallel_rspec -n 4 --only-group ${{ matrix.ci_node }} --group-by filesize -- -t "~end_user_frontend" -t "~manager_frontend" -- spec
    - name: Containers logs
      if: failure()
      run: docker compose logs
    - name: Stop containers
      if: always()
      run: docker compose down

  # The rspec job runs as the default marketplace variant. This job boots the
  # other deployment variants (MARKETPLACE_VARIANT) against a fresh database:
  # initializers, eager loading of every class, the variant-drawn routes, and
  # the request, lib, helper and routing specs. Examples tagged
  # `variant: :marketplace` exercise marketplace-only behavior and are skipped.
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [pl, whitelabel]

    steps:
    - uses: actions/checkout@v4
    - name: Start containers
      run: docker compose -f docker-compose-x64.yml up -d
    - name: Install VIPS
      run: |
        echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
        sudo apt-get update
        sudo NEEDRESTART_MODE=a apt-get install libvips42 -y --no-install-recommends
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: '20.12.2'
        check-latest: true
        cache: yarn
    - run: yarn
    - name: Boot the variant, run its specs
      env:
        RAILS_ENV: test
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        MARKETPLACE_VARIANT: ${{ matrix.variant }}
      run: |
        bundle exec rake db:drop db:create db:schema:load
        bundle exec rake test:prepare
        bundle exec rails runner 'Rails.application.eager_load!; puts "#{Mp::Variant.current}: #{Rails.application.routes.routes.count} routes"'
        bundle exec rspec spec/requests spec/lib spec/helpers spec/routing --tag ~variant:marketplace
    - name: Containers logs
      if: failure()
      run: docker compose logs
    - name: Stop containers
      if: always()
      run: docker compose down
