name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff -U20 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > diff.patch
          git diff --name-only --diff-filter=ACM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- '*.rb' > changed_ruby_files.txt

      - name: Check diff is non-empty
        id: check_diff
        run: echo "skip=$([ -s diff.patch ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - uses: ruby/setup-ruby@v1
        if: steps.check_diff.outputs.skip == 'false'
        with:
          bundler-cache: true

      - name: Run RuboCop on changed Ruby files
        if: steps.check_diff.outputs.skip == 'false'
        run: |
          if [ -s changed_ruby_files.txt ]; then
            bundle exec rubocop --force-exclusion --format json $(cat changed_ruby_files.txt) > rubocop.json || true
          else
            echo '{}' > rubocop.json
          fi

      - name: Install OpenCode
        if: steps.check_diff.outputs.skip == 'false'
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Run AI review
        if: steps.check_diff.outputs.skip == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "<!-- ai-pr-review -->" > review.md
          opencode run --model deepseek/deepseek-v4-flash \
            "Review the following PR diff for correctness bugs and simplification/efficiency issues. Ignore anything already reported by the attached RuboCop output — that's handled separately, don't repeat it. Output concise markdown suitable for a GitHub PR comment.

          RuboCop violations (JSON, may be empty):
          $(cat rubocop.json)

          Diff:
          $(cat diff.patch)" >> review.md

      - name: Find existing review comment
        if: steps.check_diff.outputs.skip == 'false'
        id: fc
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ai-pr-review -->'

      - name: Post or update review comment
        if: steps.check_diff.outputs.skip == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: review.md
          edit-mode: replace
