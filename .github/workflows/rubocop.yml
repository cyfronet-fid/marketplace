name: Rubocop
on: [pull_request]
jobs:
  rubocop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run rubocop on changed lines
      uses: reviewdog/action-rubocop@b6d5e953a5fc0bf3ab65254e77730ea2174d6d6d # v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        use_bundler: true
        skip_install: true
        only_changed: true
        reporter: github-pr-check
        # reviewdog marks the check failed whenever findings exist at the
        # `level` setting; with warning, convention findings annotate the PR
        # without failing it (the job already does not fail on them).
        level: warning
        fail_level: error
        filter_mode: diff_context
