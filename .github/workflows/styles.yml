name: Styles
on: [push, pull_request]
jobs:
  styles:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Setup and run brakeman
      run: |
        gem install brakeman
        brakeman --exit-on-warn --quiet -f plain --safe-methods sanitize

  rubocop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run rubocop on changed files
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch origin "$BASE_REF" --depth=1
        mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.rb')
        if [ "${#files[@]}" -eq 0 ]; then
          echo "No Ruby files changed, skipping rubocop"
          exit 0
        fi
        bundle exec rubocop "${files[@]}"
