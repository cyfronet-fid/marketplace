ams_subscribe_all:
  cron: "<%= ENV.fetch('AMS_SUBSCRIBE_ALL_CRON', '*/3 * * * *') %>"
  status: "<%= ENV.fetch('AMS_SUBSCRIBE_ALL_ENABLED', 'false') == 'true' ? 'enabled' : 'disabled' %>"
  class: "Ams::SubscribeAllJob"
  queue: ams_subscriber
infrastructure_state_polling:
  cron: "<%= ENV.fetch('INFRASTRUCTURE_POLLING_CRON', '* * * * *') %>"
  status: "<%= ENV.fetch('INFRASTRUCTURE_POLLING_ENABLED', 'false') == 'true' ? 'enabled' : 'disabled' %>"
  class: "Infrastructure::StatePollingJob"
  queue: default
# Matomo view sync (ADR-0008 D8); Matomo::Configuration reads MP_MATOMO_ENABLED and MP_MATOMO_SYNC_CRON.
matomo_sync_views:
  cron: "<%= Mp::Application.config.matomo.sync_cron %>"
  status: "<%= Mp::Application.config.matomo.enabled? ? 'enabled' : 'disabled' %>"
  class: "Matomo::SyncViewsJob"
  queue: default
