ams_subscribe_all:
  cron: "<%= ENV.fetch('AMS_SUBSCRIBE_ALL_CRON', '*/3 * * * *') %>"
  status: "<%= ENV.fetch('AMS_SUBSCRIBE_ALL_ENABLED', 'false') == 'true' ? 'enabled' : 'disabled' %>"
  class: "Ams::SubscribeAllJob"
  queue: ams_subscriber
infrastructure_state_polling:
  cron: "<%= ENV.fetch('INFRASTRUCTURE_POLLING_CRON', '* * * * *') %>"
  status: "<%= ENV.fetch('INFRASTRUCTURE_POLLING_ENABLED', 'false') == 'true' ? 'enabled' : 'disabled' %>"
  class: "Infrastructure::StatePollingJob"
  queue: default
# Matomo view sync (ADR-0007 D8); Matomo::Configuration reads MP_MATOMO_ENABLED and MP_MATOMO_SYNC_CRON.
# While Matomo is off there is no entry, so sidekiq-cron deletes the one a
# previous boot saved, and MP_MATOMO_SYNC_CRON is never parsed.
<% if Mp::Application.config.matomo.enabled? %>
matomo_sync_views:
  cron: "<%= Mp::Application.config.matomo.sync_cron %>"
  class: "Matomo::SyncViewsJob"
  queue: default
  # Passes the time of the run, which retries keep, so they read the same days.
  date_as_argument: true
<% end %>
